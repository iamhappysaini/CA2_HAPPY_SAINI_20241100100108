name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: CA2_HAPPY_SAINI_202401100100108

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build Docker image
        run: docker build -t ml-fastapi-app:latest .

      - name: Start and test Docker container
        run: |
          docker run -d -p 8000:8000 --name test-container ml-fastapi-app:latest
          trap 'docker logs test-container; docker rm -f test-container' EXIT
          for attempt in {1..20}; do
            if curl --silent --fail http://localhost:8000/; then
              exit 0
            fi
            sleep 1
          done
          exit 1